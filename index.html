<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta property="og:title" content="City roads and race track posters" />
    <meta property="og:description" content="Draw every road in a city, or make a print-ready poster or wallpaper of your favourite race circuit." />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Draw every road in a city, or make a print-ready poster or wallpaper of your favourite race circuit. Data from OpenStreetMap.">
    <meta name="theme-color" content="#1d1d1f">
    <title>City roads &amp; race track posters</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Caveat:wght@500&display=swap" rel="stylesheet">

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background-color: #F7F2E8;
        position: absolute;
        overflow: hidden;
        font-family: 'Avenir', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

        transition-timing-function: ease-out;
        transition-property: background-color;
        transition-duration: 3s;
      }
      #canvas, body{
        margin: 0;
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
      }
    </style>

  </head>
  <body>
    <canvas id='canvas'></canvas>
    <div id="host"></div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
